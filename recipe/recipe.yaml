schema_version: 1

context:
  name: hippynn
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/hippynn-${{ version }}.tar.gz
  sha256: 87e10de2e0db01280ac9001720e5c2e4feeed6f3487f98763af2c2126e1bcd4a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - versioneer
  run:
    - python >=${{ python_min }},<3.12
    - numpy
    - numba
    - pytorch
    - scipy

tests:
  - python:
      imports:
        - hippynn
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: The hippynn python package - a modular library for atomistic machine learning with pytorch
  license: LicenseRef-US-Government OR BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/lanl/hippynn

extra:
  recipe-maintainers:
    - lubbersnick
    - jan-janssen
